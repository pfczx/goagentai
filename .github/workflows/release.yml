name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_unix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build (GoReleaser - unix)
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: build --rm-dist --config .goreleaser.yaml-unix
      - name: Package Unix
        run: |
          mkdir -p dist/release/tmp

          # Linux amd64
          cp dist/unix/goagentai_linux_amd64_v1/goagentai dist/release/tmp/
          cp LICENSE README.md dist/release/tmp/
          tar -czf dist/release/goagentai_${GITHUB_REF_NAME}_linux_amd64.tar.gz -C dist/release/tmp .
          rm -rf dist/release/tmp/*

          # Linux arm64
          cp dist/unix/goagentai_linux_arm64/goagentai dist/release/tmp/
          cp LICENSE README.md dist/release/tmp/
          tar -czf dist/release/goagentai_${GITHUB_REF_NAME}_linux_arm64.tar.gz -C dist/release/tmp .
          rm -rf dist/release/tmp/*

          # Linux 386
          cp dist/unix/goagentai_linux_386/goagentai dist/release/tmp/
          cp LICENSE README.md dist/release/tmp/
          tar -czf dist/release/goagentai_${GITHUB_REF_NAME}_linux_386.tar.gz -C dist/release/tmp .
          rm -rf dist/release/tmp/*

          # macOS amd64
          cp dist/unix/goagentai_darwin_amd64_v1/goagentai dist/release/tmp/
          cp LICENSE README.md dist/release/tmp/
          tar -czf dist/release/goagentai_${GITHUB_REF_NAME}_darwin_amd64.tar.gz -C dist/release/tmp .
          rm -rf dist/release/tmp/*

          # macOS arm64
          cp dist/unix/goagentai_darwin_arm64/goagentai dist/release/tmp/
          cp LICENSE README.md dist/release/tmp/
          tar -czf dist/release/goagentai_${GITHUB_REF_NAME}_darwin_arm64.tar.gz -C dist/release/tmp .
          rm -rf dist/release/tmp/*

      - name: Upload Unix artifact
        uses: actions/upload-artifact@v4
        with:
          name: unix-artifact
          path: dist/release/*

  build_windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build (GoReleaser - windows)
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: build --rm-dist --config .goreleaser.yaml-windows

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\release\tmp

          Copy-Item dist\windows\goagentai_windows_amd64_v1\goagentai.exe dist\release\tmp\
          Copy-Item LICENSE dist\release\tmp\
          Copy-Item README.md dist\release\tmp\

          Compress-Archive `
          -Path dist\release\tmp\* `
          -DestinationPath dist\release\goagentai_${env:GITHUB_REF_NAME}_windows_amd64.zip

          Remove-Item dist\release\tmp\* -Recurse -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: dist/release/*

  release:
    runs-on: ubuntu-latest
    needs: [build_unix, build_windows]

    steps:
      - name: Download Unix artifact
        uses: actions/download-artifact@v4
        with:
          name: unix-artifact
          path: dist/unix

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact
          path: dist/windows

      - name: Show files
        run: find . -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
