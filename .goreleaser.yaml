project_name: goagentai

builds:
  - binary: goagentai
    main: ./main.go
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - "386"
      - "amd64"
      - "arm64"
    ldflags:
      - -s -w

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"
