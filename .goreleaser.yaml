project_name: goagentai

builds:
  - binary: goagentai
    main: ./main.go
    goos: [linux, darwin] 
    goarch: ["386", "amd64", "arm64"]
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0

  - binary: goagentai
    main: ./main.go
    goos: [windows]
    goarch: ["amd64"]
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=1

archives:
  - formats:
      - tar.gz
      - zip
    format_overrides:
      - goos: windows
        formats:
          - zip
      - goos: linux
        formats:
          - tar.gz
      - goos: darwin
          - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
